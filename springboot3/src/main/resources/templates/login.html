<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0b1324;
            background-image: radial-gradient(circle at 10% 20%, rgba(0,153,255,0.12) 0%, transparent 40%),
            radial-gradient(circle at 85% 75%, rgba(0,204,255,0.08) 0%, transparent 45%);
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 420px;
            padding: 45px 35px;
            background: rgba(16, 26, 48, 0.75);
            border: 1px solid rgba(0, 170, 255, 0.25);
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0,140,255,0.18);
            backdrop-filter: blur(10px);
        }
        .login-title {
            text-align: center;
            color: #40c8ff;
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 36px;
            text-shadow: 0 0 10px rgba(64,200,255,0.45);
        }
        .form-item {
            margin-bottom: 22px;
        }
        .form-item input {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            background-color: rgba(8,16,32,0.6);
            border: 1px solid rgba(0,170,255,0.3);
            border-radius: 6px;
            color: #e6f4ff;
            font-size: 15px;
            outline: none;
            transition: all 0.28s ease;
        }
        .form-item input::placeholder {
            color: rgba(170,210,255,0.45);
        }
        .form-item input:focus {
            border-color: #00b8ff;
            box-shadow: 0 0 12px rgba(0,184,255,0.35);
        }
        .submit-btn {
            width: 100%;
            height: 48px;
            margin-top: 10px;
            background: linear-gradient(90deg,#007bff,#00b8ff);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            box-shadow: 0 0 18px rgba(0,160,255,0.55);
            background: linear-gradient(90deg,#0088ff,#00c0ff);
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1 class="login-title">登录入口</h1>
    <form th:action="@{/login}" method="post">
        <div class="form-item">
            <input id="username" name="username" type="text" placeholder="请输入用户"/>
        </div>
        <div class="form-item">
            <input id="password" name="password" type="password" placeholder="请输入密码"/>
        </div>
        <input class="submit-btn" type="submit" value="登 录">
    </form>
</div>
</body>
</html>
