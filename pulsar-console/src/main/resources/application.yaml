server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    persistent-sessions: false

spring:
  application:
    name: pulsar-console
  web:
    resources:
      static-locations: classpath:/static/,classpath:/js/,classpath:/element/,classpath:/css/
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsar_console
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
