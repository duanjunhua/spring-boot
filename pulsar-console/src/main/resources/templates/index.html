<!DOCTYPE html>
<html lang="zh-CN" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
    <link rel="stylesheet" th:href="@{/element/index.css}">
</head>
<body style="padding:50px;">
<el-card>
    <h3>欢迎登录系统</h3>
    <p>当前登录用户：<span sec:authentication="principal.username"></span></p>
    <p>登录类型：<span th:text="${user.getClass().simpleName}"></span></p>
    <div style="margin-top:20px;">
        <a th:href="@{/logout}">
            <el-button type="danger">退出登录</el-button>
        </a>
    </div>
</el-card>

<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/element/index.js}"></script>
</body>
</html>
