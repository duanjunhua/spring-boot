<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统初始化配置</title>
    <style>
        .box{width:600px;margin:100px auto;padding:30px;border:1px solid #eee;border-radius:8px;}
        .item{margin:12px 0;}
        label{display:block;margin-bottom:4px}
        input,select{width:100%;padding:8px;box-sizing:border-box}
        button{padding:10px 30px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer}
    </style>
</head>
<body>
<div class="box">
    <h2>系统初始化配置</h2>
    <form th:action="@{/init/save}" method="post">
        <div class="item">
            <label>超级管理员[pulsar]密码初始化</label>
            <input type="password" name="passwordHash" required>
        </div>
        <div class="item">
            <label>启用OAuth2 SSO单点登录</label>
            <select name="oauthEnable" id="oauthSwitch">
                <option value="0">关闭（仅本地账号登录）</option>
                <option value="1">开启（普通用户强制SSO）</option>
            </select>
        </div>
        <div id="oauthParamBox" style="display:none">
            <div class="item"><label>ClientId</label><input name="clientId"></div>
            <div class="item"><label>ClientSecret</label><input name="clientSecret"></div>
            <div class="item"><label>授权地址</label><input name="authUri"></div>
            <div class="item"><label>Token地址</label><input name="tokenUri"></div>
            <div class="item"><label>用户信息地址</label><input name="userInfoUri"></div>
            <div class="item"><label>回调地址</label><input name="redirectUri"></div>
        </div>
        <div class="item">
            <button type="submit">完成初始化</button>
        </div>
    </form>
</div>
<script>
    const switchEl = document.getElementById("oauthSwitch");
    const box = document.getElementById("oauthParamBox");
    switchEl.onchange = function(){
        box.style.display = this.value == 1 ? "block" : "none";
    }
</script>
</body>
</html>
