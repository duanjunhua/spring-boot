<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>.login-box{width:400px;margin:100px auto;padding:30px;border:1px solid #eee}</style>
</head>
<body>
<div class="login-box">
    <h2>系统登录</h2>
    <h4>超级管理员可直接账号密码登录；普通用户需OAuth2 SSO登录</h4>
    <form th:action="@{/doLogin}" method="post">
        <div>
            <label>登录名</label>
            <input name="username" required style="width:100%;margin:8px 0;padding:8px">
        </div>
        <div>
            <label>密码</label>
            <input type="password" name="password" required style="width:100%;margin:8px 0;padding:8px">
        </div>
        <button type="submit" style="width:100%;padding:10px;margin-top:10px">账号密码登录</button>
    </form>
    <div th:if="${@sysConfigServiceImpl.getConfigValue('sso.enable') == 'true'}" style="margin-top:20px;text-align:center">
        <!-- pulsar-console为应用名 -->
        <a th:href="@{/oauth2/authorization/pulsar-console}" style="padding:10px 20px;background:#28a745;color:white;text-decoration:none">第三方SSO登录</a>
    </div>
</div>
</body>
</html>
