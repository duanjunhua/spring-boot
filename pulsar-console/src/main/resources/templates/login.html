<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>.login-box{width:400px;margin:100px auto;padding:30px;border:1px solid #eee}</style>
</head>
<body>

    <div class="login-box">
        <h2 align="center">账号登录</h2>
        <form th:action="@{/doLogin}" method="post">
            <div>
                <label>登录名</label>
                <input name="username" required style="width:100%;margin:8px 0;padding:8px">
            </div>
            <div>
                <label>密码</label>
                <input type="password" name="password" required style="width:100%;margin:8px 0;padding:8px">
            </div>
            <button type="submit" style="width:100%;padding:10px;margin-top:10px">账号密码登录</button>
        </form>

        <div style="margin:20px 0;text-align:center;color:#999;">———— 第三方单点登录 ————</div>

        <!-- OAuth2三方登录按钮：跳转授权地址 -->
        <div align="center" th:if="${ssoEnable}">
            <a th:href="@{/oauth2/authorization/{id}(id=${registrationId})}">
                <el-button type="success">SSO登录</el-button>
            </a>
        </div>

        <!-- 错误提示 -->
        <div th:if="${param.error}" style="color:red;margin-top:15px;text-align:center;">
            用户名或密码错误，请重新输入
        </div>
        <div th:if="${param.logout}" style="color:green;margin-top:15px;text-align:center;">
            已成功退出登录
        </div>
    </div>
</body>
</html>
