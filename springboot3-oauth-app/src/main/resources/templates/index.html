<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SSO 认证中心 - 管理首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        .header {
            height: 60px;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .header-title {
            font-size: 20px;
            font-weight: bold;
        }
        .user-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .logout-btn {
            padding: 6px 16px;
            background: #ef4444;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .container {
            width: 1200px;
            margin: 40px auto;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 16px;
            color: #1f2937;
        }
        .info-row {
            line-height: 2.2;
            font-size: 15px;
            color: #4b5563;
        }
        .label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        .menu-box {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .menu-item {
            width: 180px;
            height: 100px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2563eb;
            font-weight: 500;
        }
        .menu-item:hover {
            background: #dbeafe;
        }
    </style>
</head>
<body>
<!-- 顶部导航栏 -->
<div class="header">
    <div class="header-title">SSO 统一认证中心</div>
    <div class="user-info">
        <span>欢迎，<span th:text="${username}"></span></span>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button class="logout-btn" type="submit">退出登录</button>
        </form>
    </div>
</div>

<div class="container">
    <!-- 当前登录用户信息卡片 -->
    <div class="card">
        <h3>账号信息</h3>
        <div class="info-row">
            <span class="label">登录账号：</span>
            <span th:text="${username}"></span>
        </div>
        <div class="info-row">
            <span class="label">用户权限：</span>
            <span th:text="${authorities}"></span>
        </div>
    </div>

    <!-- SSO功能菜单 -->
    <div class="card">
        <h3>认证中心功能</h3>
        <div class="menu-box">
            <div class="menu-item">接入客户端管理</div>
            <div class="menu-item">授权记录查询</div>
            <div class="menu-item">用户账号管理</div>
            <div class="menu-item">Token 管理</div>
        </div>
    </div>

    <!-- OAuth2 OIDC 端点地址 -->
    <div class="card">
        <h3>开放认证端点（供第三方系统接入）</h3>
        <div class="info-row">
            <span class="label">授权地址：</span>
            <span>[[${issuer}]]/oauth2/authorize</span>
        </div>
        <div class="info-row">
            <span class="label">Token获取地址：</span>
            <span>[[${issuer}]]/oauth2/token</span>
        </div>
        <div class="info-row">
            <span class="label">用户信息接口：</span>
            <span>[[${issuer}]]/userinfo</span>
        </div>
        <div class="info-row">
            <span class="label">JWKS公钥地址：</span>
            <span>[[${issuer}]]/.well-known/jwks.json</span>
        </div>
    </div>
</div>
</body>
</html>
