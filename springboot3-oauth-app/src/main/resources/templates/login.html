<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SSO统一登录中心</title>
    <style>.login-box{width:400px;margin:100px auto;padding:30px;border:1px solid #eee}</style>
</head>
    <body>
        <div class="login-box">
            <h2>单点登录认证中心</h2>

            <!-- 登录错误提示 -->
            <div th:if="${param.error}" style="color:red">用户名或密码错误</div>
            <form th:action="@{/doLogin}" method="post">
                <div>
                    <label>登录名</label>
                    <input name="username" placeholder="请输入账号" required style="width:100%;margin:8px 0;padding:8px">
                </div>
                <div>
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required style="width:100%;margin:8px 0;padding:8px">
                </div>
                <button type="submit" style="width:100%;padding:10px;margin-top:10px">登录</button>
            </form>
        </div>
    </body>
</html>
