<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Flux AI 对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #d9e9ff, #b5d8ff 80%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 主面板——双栏玻璃态卡片 */
        .app-window {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 40px 80px -20px rgba(0, 40, 80, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.7);
        }

        /* ========= 左侧历史会话面板 ========= */
        .history-panel {
            width: 300px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            padding: 28px 0 20px 0;
            box-shadow: 4px 0 20px rgba(0, 30, 50, 0.05);
        }

        .history-header {
            padding: 0 22px 24px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: #0b2f42;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-header h3 svg {
            width: 22px;
            height: 22px;
            fill: #2a5f7a;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 110, 190, 0.3);
            border-radius: 32px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .new-chat-btn:hover {
            background: white;
            border-color: #0095ff;
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0, 120, 230, 0.2);
        }

        .new-chat-btn svg {
            width: 20px;
            height: 20px;
            fill: #0070b3;
        }

        /* 会话列表 */
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 0 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .session-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.18s;
            box-shadow: 0 4px 10px rgba(0, 30, 40, 0.02);
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.75);
            border-color: #b0d6ff;
            transform: translateY(-1px);
            box-shadow: 0 12px 22px -10px rgba(0, 100, 200, 0.3);
        }

        .session-item.active {
            background: rgba(255, 255, 255, 0.95);
            border-color: #0095ff;
            box-shadow: 0 10px 20px -8px #0095ff70;
        }

        .session-avatar {
            width: 40px;
            height: 40px;
            border-radius: 40px;
            background: linear-gradient(145deg, #d0e6ff, #b2d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a568c;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 2px solid white;
        }

        .session-info {
            flex: 1;
            overflow: hidden;
        }

        .session-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #113946;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .session-preview {
            font-size: 0.75rem;
            color: #446f88;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.8;
        }

        .session-time {
            font-size: 0.7rem;
            color: #688da0;
            white-space: nowrap;
            margin-left: 4px;
        }

        /* ========= 右侧对话主区 ========= */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
        }

        /* 对话头部 */
        .chat-header {
            padding: 24px 30px 18px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-header h2 {
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -0.5px;
            color: #003c5a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header h2 span {
            background: rgba(0, 110, 190, 0.15);
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 450;
            color: #005d96;
            border: 1px solid rgba(0, 140, 230, 0.3);
            letter-spacing: normal;
        }

        /* 消息区域 — 流式内容 */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            max-width: 82%;
            animation: messagePop 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .bubble {
            padding: 18px 26px;
            border-radius: 32px;
            line-height: 1.6;
            font-size: 1rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 8px 20px rgba(0, 30, 50, 0.08);
            backdrop-filter: blur(4px);
        }

        .user .bubble {
            background: linear-gradient(135deg, #0077be, #0060a0);
            color: white;
            border-bottom-right-radius: 8px;
            box-shadow: 0 12px 24px -8px #0077be80;
        }

        .assistant .bubble {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            color: #103543;
            border-bottom-left-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 28px -12px #305d7a50;
        }

        /* 光标效果 */
        .streaming-cursor {
            display: inline-block;
            width: 2.5px;
            height: 1.2em;
            background: #0088dd;
            vertical-align: middle;
            margin-left: 5px;
            border-radius: 4px;
            animation: soft-blink 1.2s infinite;
        }

        @keyframes soft-blink {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
        }

        @keyframes messagePop {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 输入区 */
        .input-area {
            padding: 20px 28px 28px 28px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.7);
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 6px 22px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02), 0 6px 16px rgba(0, 70, 120, 0.08);
            transition: 0.15s;
        }

        .input-wrapper:focus-within {
            border-color: #ffffff;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 150, 255, 0.25), 0 8px 18px rgba(0,100,200,0.15);
        }

        textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 1.02rem;
            padding: 14px 0 10px 0;
            max-height: 150px;
            background: transparent;
            color: #123c4d;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #588097;
            font-weight: 350;
            letter-spacing: -0.2px;
        }

        .action-button {
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .send-button {
            background: #0082c9;
            color: white;
        }

        .send-button:hover {
            background: #0070b0;
            transform: scale(1.05);
            box-shadow: 0 16px 26px -6px #0082c9cc;
        }

        .stop-button {
            background: #cf4a4e;
            color: white;
        }

        .stop-button:hover {
            background: #b53b3f;
            transform: scale(1.05);
            box-shadow: 0 16px 26px -6px #cf4a4ecc;
        }

        .action-button svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .info-note {
            font-size: 0.75rem;
            color: #2c607b;
            margin-top: 6px;
            text-align: center;
            opacity: 0.6;
            letter-spacing: 0.3px;
        }

        /* 自定义滚动条 */
        .messages-area::-webkit-scrollbar, .session-list::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-track, .session-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-area::-webkit-scrollbar-thumb, .session-list::-webkit-scrollbar-thumb {
            background: rgba(0, 80, 120, 0.25);
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div class="app-window">
    <!-- 左侧历史会话区域 -->
    <div class="history-panel">
        <div class="history-header">
            <h3>
                <svg viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 10h-5v5h-2v-5H8v-2h5V6h2v5h5v2z"/>
                </svg>
                历史会话
            </h3>
            <div class="new-chat-btn" id="newChatBtn" title="新建会话">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
        </div>
        <div class="session-list" id="sessionList">
            <!-- 动态通过js生成，保留几个示例，后续可追加 -->
        </div>
        <!-- 底部可以加个小水印，无妨 -->
    </div>

    <!-- 右侧主对话界面 -->
    <div class="chat-main">
        <div class="chat-header">
            <h2>
                ✦ Flux 流式对话
            </h2>
        </div>

        <!-- 消息列表 -->
        <div id="messageList" class="messages-area">
            <!-- 欢迎消息由JS生成，保证一致性 -->
        </div>

        <!-- 输入栏 + 按钮 -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="输入消息... (Shift+Enter换行, Enter发送)" rows="1"></textarea>
            </div>
            <button id="sendBtn" class="action-button send-button" title="发送 (Enter)">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
            <button id="stopBtn" class="action-button stop-button" title="停止生成" style="display: none;">
                <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>
            </button>
        </div>
        <div class="info-note">https://github.com/duanjunhua</div>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM 元素 ----------
        const messageList = document.getElementById('messageList');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sessionList = document.getElementById('sessionList');
        const newChatBtn = document.getElementById('newChatBtn');

        // ---------- 状态 ----------
        let isStreaming = false;                 // 是否正在流式接收
        let abortController = null;               // 用于中断fetch
        let currentBubbleElement = null;           // 当前助手消息bubble

        // 会话数据 (简化：内存存储)
        let sessions = [
            { id: '1', name: '新建会话', preview: '开启新的对话', time: '10:30', active: true },
        ];
        let currentSessionId = '1';   // 默认激活第一个

        // ---------- 渲染历史会话列表 ----------
        function renderSessions() {
            sessionList.innerHTML = '';
            sessions.forEach(session => {
                const item = document.createElement('div');
                item.className = `session-item ${session.active ? 'active' : ''}`;
                item.dataset.id = session.id;

                // 头像取首字母
                const avatarLetter = session.name.charAt(0).toUpperCase();

                item.innerHTML = `
                    <div class="session-avatar">${avatarLetter}</div>
                    <div class="session-info">
                        <div class="session-name">${session.name}</div>
                        <div class="session-preview">${session.preview}</div>
                    </div>
                    <div class="session-time">${session.time}</div>
                `;

                item.addEventListener('click', () => {
                    // 更新激活状态
                    sessions.forEach(s => s.active = (s.id === session.id));
                    currentSessionId = session.id;
                    renderSessions();

                    // 模拟加载对应会话的历史消息（此处为了演示，在右侧显示切换提示）
                    // 真实场景会从后端拉历史，这里简单追加一条系统提示
                    addAssistantMessage(`切换到会话「${session.name}」，可以开始提问。`);
                });

                sessionList.appendChild(item);
            });
        }

        // 辅助：添加一条助手消息（非流式，用于欢迎/切换提示）
        function addAssistantMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            msgDiv.appendChild(bubble);
            messageList.appendChild(msgDiv);
            scrollToBottom();
        }

        // 初次加载欢迎消息 (避免重复)
        function initWelcome() {
            messageList.innerHTML = '';  // 清空占位
            addAssistantMessage('你好！我是 AI 助手 (Flux 流式)。左侧记录了历史会话，你可以随时切换。');
        }

        // 新建会话
        function createNewSession() {
            const newId = Date.now().toString();
            const newSession = {
                id: newId,
                name: '新对话',
                preview: '开始新的会话...',
                time: '刚刚',
                active: true
            };
            // 把之前的active全部设为false
            sessions.forEach(s => s.active = false);
            sessions.push(newSession);
            currentSessionId = newId;
            renderSessions();

            // 清空右侧消息列表，并给个欢迎
            messageList.innerHTML = '';
            addAssistantMessage('新建会话已创建。有什么可以帮你的？');
        }

        // ---------- 流式相关函数 ----------
        function scrollToBottom() {
            setTimeout(() => messageList.scrollTop = messageList.scrollHeight, 20);
        }

        function addUserMessage(text) {
            if (!text.trim()) return;
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            messageDiv.appendChild(bubble);
            messageList.appendChild(messageDiv);
            scrollToBottom();
        }

        // 获取或创建当前助手气泡 (流式专用)
        function getOrCreateAssistantBubble() {
            if (isStreaming && currentBubbleElement && document.body.contains(currentBubbleElement)) {
                return currentBubbleElement;
            }
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = '';
            messageDiv.appendChild(bubble);
            messageList.appendChild(messageDiv);
            currentBubbleElement = bubble;
            return bubble;
        }

        function appendStreamChunk(text) {
            if (!currentBubbleElement) getOrCreateAssistantBubble();
            currentBubbleElement.textContent += text;
            scrollToBottom();
        }

        function finishStreaming() {
            isStreaming = false;
            abortController = null;
            currentBubbleElement = null;
            sendBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            userInput.disabled = false;
            userInput.focus();

            // 更新左侧对应会话的预览（简易：取最后一条用户消息作为预览？ 这里简化，不自动更新预览）
            // 可留作扩展
        }

        function abortStream() {
            if (abortController && isStreaming) {
                abortController.abort();
            }
        }

        // 模拟流式请求 (Flux 风格)
        async function sendMessageToFlux(userMessage) {
            abortController = new AbortController();
            const signal = abortController.signal;

            sendBtn.style.display = 'none';
            stopBtn.style.display = 'flex';
            userInput.disabled = true;

            // 新建助手气泡
            const newMsgDiv = document.createElement('div');
            newMsgDiv.className = 'message assistant';
            const newBubble = document.createElement('div');
            newBubble.className = 'bubble';
            newBubble.textContent = '';
            newMsgDiv.appendChild(newBubble);
            messageList.appendChild(newMsgDiv);
            currentBubbleElement = newBubble;
            scrollToBottom();

            isStreaming = true;

            // Flux 后端流式响应
            const FLUX_API_URL = 'http://localhost:9090/ai/chat-stream';

            try {

                /* ---------- 真实fetch示例 ---------- */
                const response = await fetch(FLUX_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: userMessage,
                    signal,
                });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    if (chunk) appendStreamChunk(chunk);
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    appendStreamChunk(' [已中断]');
                } else {
                    console.error(error);
                    appendStreamChunk(`\n[连接错误]`);
                }
            } finally {
                finishStreaming();
                // 更新当前会话预览（这里简单把用户消息作为预览）
                const activeSession = sessions.find(s => s.id === currentSessionId);
                if (activeSession) {
                    activeSession.preview = userMessage.substring(0, 16) + (userMessage.length > 16 ? '...' : '');
                    activeSession.time = '刚刚';
                    renderSessions(); // 刷新预览
                }
            }
        }

        function handleSend() {
            const rawMsg = userInput.value.trim();
            if (!rawMsg) return;

            if (isStreaming) {
                alert('请等待当前回复结束，或点击停止按钮中断。');
                return;
            }

            // 添加用户消息
            addUserMessage(rawMsg);

            // 清空输入
            userInput.value = '';
            userInput.style.height = 'auto';

            // 发起流式
            sendMessageToFlux(rawMsg);
        }

        // 处理停止
        function handleStop() {
            if (isStreaming) abortStream();
        }

        // 键盘事件
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!isStreaming) handleSend();
            }
        });

        // 自动调整高度
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(150, this.scrollHeight) + 'px';
        });

        // 绑定按钮
        sendBtn.addEventListener('click', handleSend);
        stopBtn.addEventListener('click', handleStop);
        newChatBtn.addEventListener('click', createNewSession);

        // 初始化
        renderSessions();
        initWelcome();
        userInput.focus();

        // 防止在停止后未恢复
    })();
</script>
<!-- 说明：左侧会话是静态示例，新建会话会添加条目并清空右侧。流式模拟每60ms一个字，可替换为真实Flux接口 -->
</body>
</html>
